spring.application.name=proyectos

# Conexion a PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/proyectos_db
spring.datasource.username=postgres
spring.datasource.password=Gq1710

# Driver
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate crea y actualiza tablas automaticamente
spring.jpa.hibernate.ddl-auto=update

# Mostrar y formatear SQL en consola
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logs de Spring y Hibernate
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE